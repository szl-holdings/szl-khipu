name: KHIPU-X1 reference

on:
  pull_request:
    paths:
      - "hardware/khipu-x1/**"
      - ".github/workflows/khipu-x1-reference.yml"
  push:
    branches: [main]
    paths:
      - "hardware/khipu-x1/**"
      - ".github/workflows/khipu-x1-reference.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/khipu-x1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hardware/khipu-x1/pyproject.toml
      - name: Install reference package
        run: python -m pip install -e ".[dev]"
      - name: Run KIDS v0.1 conformance
        run: pytest -q
