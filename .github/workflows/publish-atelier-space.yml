name: publish-atelier-space

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "atelier-space/**"
      - ".github/workflows/publish-atelier-space.yml"

permissions:
  contents: read

concurrency:
  group: publish-atelier-space-${{ github.ref }}
  cancel-in-progress: false

jobs:
  space:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Create / update SZLHOLDINGS/szl-atelier static Space
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_ORG: SZLHOLDINGS
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN / HF_ORG_TOKEN unset — Space publish BLOCKED."
            echo "Not a fake upload. GitHub remains the source of truth."
            echo "::error::HF_TOKEN / HF_ORG_TOKEN is not set — Space publish cannot run. A mirror that cannot write must not report success."
            exit 1
          fi
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.26"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          repo_id = "SZLHOLDINGS/szl-atelier"
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="static", exist_ok=True, private=False)
          api.upload_folder(
              folder_path="atelier-space",
              repo_id=repo_id,
              repo_type="space",
              ignore_patterns=[".git*", ".github/*"],
          )
          print("published", repo_id)
          PY
