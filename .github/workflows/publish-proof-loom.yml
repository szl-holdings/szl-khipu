# Dedicated public research Space. Protected-main source is the only writer.
# Never runs on pull requests and never changes the existing Docker Khipu Space.
name: publish-proof-loom

on:
  # Protected-main push/merge MUST NOT trigger the action-bearing Hub publisher.
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: "Exact immutable main commit independently approved for this publication"
        required: true
        type: string
      confirm_publish:
        description: "Type PUBLISH_KHIPU_PROOF_LOOM to explicitly opt in"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-proof-loom-main
  cancel-in-progress: false

jobs:
  source-and-publication:
    # All controls default DENY. GitHub vars/actor are not a signed owner proof.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.reviewed_source_sha == github.sha && inputs.confirm_publish == 'PUBLISH_KHIPU_PROOF_LOOM' && vars.SZL_PROOFLOOM_PUBLISH_ENABLED == 'true' && github.actor == vars.SZL_PROOFLOOM_PUBLISH_OPERATOR }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify explicit source and operator boundary before checkout
        shell: bash
        env:
          SZL_REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          SZL_PUBLISH_APPROVAL: ${{ inputs.confirm_publish }}
          SZL_APPROVED_OPERATOR: ${{ vars.SZL_PROOFLOOM_PUBLISH_OPERATOR }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "szl-holdings/szl-khipu" ]] || exit 78
          [[ "$GITHUB_WORKFLOW" == "publish-proof-loom" ]] || exit 78
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || exit 78
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 78
          [[ "$SZL_REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 78
          [[ "$SZL_REVIEWED_SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 78
          [[ "$SZL_PUBLISH_APPROVAL" == "PUBLISH_KHIPU_PROOF_LOOM" ]] || exit 78
          [[ -n "$SZL_APPROVED_OPERATOR" ]] || exit 78
          [[ "$GITHUB_ACTOR" == "$SZL_APPROVED_OPERATOR" ]] || exit 78
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install existing hash-locked Hub toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci/hub.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run hermetic finite/3D and publisher admission contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_proof_loom.py -v
          python -m unittest discover -s tests -p test_proofloom_publisher.py -v
          python -m unittest discover -s tests -p test_rr_sequence_scout.py -v
          python -m unittest discover -s tests -p test_rr_conjecture_crucible.py -v
          python -m unittest discover -s tests -p test_hjo_cylindric_profile.py -v
          python -m unittest discover -s tests -p test_hjo_loom.py -v
          python -m unittest discover -s tests -p test_okr_khipu.py -v
          python research/rr_discovery/learner.py --check research/rr_discovery/receipts/sequence_scout_v1.json
          python scripts/publish_proofloom.py --check
      - name: Replay the sealed HJO finite certificate from scratch
        run: python research/hjo_loom/build_certificate.py --check research/hjo_loom/hjo_certificate_v1.json
      - name: Rebuild the OKR corpus and relations report from the pinned upstream database
        shell: bash
        run: |
          set -euo pipefail
          okr="https://raw.githubusercontent.com/khipulab/open-khipu-repository/4039ca51f4de661d80d0160596309c983a62a9c7/data"
          mkdir -p "$RUNNER_TEMP/okr"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/okr/khipu.db" "$okr/khipu.db"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/okr/okr-kh-numbers.csv" "$okr/okr-kh-numbers.csv"
          printf '%s  %s\n' \
            607913034a0f478c5c792025d0c3cab8a9a8f05223ed6bc9c2990122a8c1c4db "$RUNNER_TEMP/okr/khipu.db" \
            d0453883762b2511f72bf48672a7c018084d67d59fe12a4a11bc3ab6b9708e5e "$RUNNER_TEMP/okr/okr-kh-numbers.csv" \
            | sha256sum -c -
          python -I research/okr_corpus/build_corpus.py --db "$RUNNER_TEMP/okr/khipu.db" --relations --check
      - name: Replay separate post-hoc R2 spatial-shift sensitivity
        run: python -I research/okr_corpus/spatial_null.py --check research/okr_corpus/spatial_null_v1.json
      - name: Publish and independently read back Hugging Face bytes and live config
        env:
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROOF_LOOM_PUBLISH_ENABLED: ${{ vars.SZL_PROOFLOOM_PUBLISH_ENABLED }}
          PROOF_LOOM_ALLOWED_ACTOR: ${{ vars.SZL_PROOFLOOM_PUBLISH_OPERATOR }}
          PROOF_LOOM_PUBLISH_APPROVAL: ${{ inputs.confirm_publish }}
          PROOF_LOOM_REVIEWED_SHA: ${{ inputs.reviewed_source_sha }}
        run: python scripts/publish_proofloom.py --publish
      - name: Preserve provider attempt and verified outcome separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-loom-hub-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proof-loom-publication.journal.jsonl
            proof-loom-hub-publication.json
          if-no-files-found: warn
          retention-days: 90
