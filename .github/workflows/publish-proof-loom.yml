# Dedicated public research Space. Protected-main source is the only writer.
# Never runs on pull requests and never changes the existing Docker Khipu Space.
name: publish-proof-loom

on:
  push:
    branches: [main]
    paths:
      - "szl_khipu/proof_loom.py"
      - "szl_khipu/hjo_loom.py"
      - "szl_khipu/holo_glb.py"
      - "szl_khipu/okr_khipu.py"
      - "szl_khipu/chain.py"
      - "research/rr_discovery/**"
      - "research/hjo_profile/**"
      - "research/hjo_loom/**"
      - "research/okr_corpus/**"
      - "spaces/proof-loom/**"
      - "scripts/publish_proofloom.py"
      - "tests/test_proof_loom.py"
      - "tests/test_proofloom_publisher.py"
      - "tests/test_rr_sequence_scout.py"
      - "tests/test_rr_conjecture_crucible.py"
      - "tests/test_hjo_cylindric_profile.py"
      - "tests/test_hjo_loom.py"
      - "tests/test_okr_khipu.py"
      - ".github/workflows/publish-proof-loom.yml"

permissions:
  contents: read

concurrency:
  group: publish-proof-loom-main
  cancel-in-progress: false

jobs:
  source-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install existing hash-locked Hub toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci/hub.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run hermetic finite/3D and publisher admission contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_proof_loom.py -v
          python -m unittest discover -s tests -p test_proofloom_publisher.py -v
          python -m unittest discover -s tests -p test_rr_sequence_scout.py -v
          python -m unittest discover -s tests -p test_rr_conjecture_crucible.py -v
          python -m unittest discover -s tests -p test_hjo_cylindric_profile.py -v
          python -m unittest discover -s tests -p test_hjo_loom.py -v
          python -m unittest discover -s tests -p test_okr_khipu.py -v
          python research/rr_discovery/learner.py --check research/rr_discovery/receipts/sequence_scout_v1.json
          python scripts/publish_proofloom.py --check
      - name: Replay the sealed HJO finite certificate from scratch
        run: python research/hjo_loom/build_certificate.py --check research/hjo_loom/hjo_certificate_v1.json
      - name: Rebuild the OKR corpus and relations report from the pinned upstream database
        shell: bash
        run: |
          set -euo pipefail
          okr="https://raw.githubusercontent.com/khipulab/open-khipu-repository/4039ca51f4de661d80d0160596309c983a62a9c7/data"
          mkdir -p "$RUNNER_TEMP/okr"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/okr/khipu.db" "$okr/khipu.db"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/okr/okr-kh-numbers.csv" "$okr/okr-kh-numbers.csv"
          printf '%s  %s\n' \
            607913034a0f478c5c792025d0c3cab8a9a8f05223ed6bc9c2990122a8c1c4db "$RUNNER_TEMP/okr/khipu.db" \
            d0453883762b2511f72bf48672a7c018084d67d59fe12a4a11bc3ab6b9708e5e "$RUNNER_TEMP/okr/okr-kh-numbers.csv" \
            | sha256sum -c -
          python -I research/okr_corpus/build_corpus.py --db "$RUNNER_TEMP/okr/khipu.db" --relations --check
      - name: Publish and independently read back Hugging Face bytes and live config
        env:
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_proofloom.py --publish
      - name: Preserve provider attempt and verified outcome separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-loom-hub-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proof-loom-publication.journal.jsonl
            proof-loom-hub-publication.json
          if-no-files-found: warn
          retention-days: 90
