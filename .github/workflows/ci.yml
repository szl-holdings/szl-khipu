name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Dependencies come only from the hash-locked set (requirements/ci/test.in
      # mirrors pyproject's runtime deps + `test` extra); the package installs
      # without resolving anything else.
      - name: Install hash-locked dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/test.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  research-replay:
    # From-scratch replays of the sealed research artifacts the Proof Loom
    # Space serves; publish-proof-loom repeats them on protected main.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install hash-locked dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/test.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Replay the sealed HJO finite certificate
        run: python research/hjo_loom/build_certificate.py --check research/hjo_loom/hjo_certificate_v1.json
      - name: Rebuild the OKR corpus and relations report from the pinned upstream database
        shell: bash
        run: |
          set -euo pipefail
          okr="https://raw.githubusercontent.com/khipulab/open-khipu-repository/4039ca51f4de661d80d0160596309c983a62a9c7/data"
          mkdir -p "$RUNNER_TEMP/okr"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/okr/khipu.db" "$okr/khipu.db"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/okr/okr-kh-numbers.csv" "$okr/okr-kh-numbers.csv"
          printf '%s  %s\n' \
            607913034a0f478c5c792025d0c3cab8a9a8f05223ed6bc9c2990122a8c1c4db "$RUNNER_TEMP/okr/khipu.db" \
            d0453883762b2511f72bf48672a7c018084d67d59fe12a4a11bc3ab6b9708e5e "$RUNNER_TEMP/okr/okr-kh-numbers.csv" \
            | sha256sum -c -
          python -I research/okr_corpus/build_corpus.py --db "$RUNNER_TEMP/okr/khipu.db" --relations --check
      - name: Replay post-hoc spatial-shift sensitivity from pinned OKR corpus
        run: python -I research/okr_corpus/spatial_null.py --check research/okr_corpus/spatial_null_v1.json
      - name: Corpus rebuild unit test against the pinned database
        env:
          SZL_OKR_DB: ${{ runner.temp }}/okr/khipu.db
        run: python -m unittest discover -s tests -p test_okr_khipu.py -v
      - name: Replay the published-reading checks and the hidden-cord test
        run: |
          python -I research/okr_readings/build_features.py --db "$RUNNER_TEMP/okr/khipu.db" --check
          python -I research/okr_readings/build_features.py --db "$RUNNER_TEMP/okr/khipu.db" --knots --check
          python -I research/okr_readings/santa_valley.py --check
          python -I research/okr_readings/puruchuco.py --check
          python -I research/okr_readings/hidden_cord.py --check
      - name: Replay the knot-direction test and the matching-khipu search
        run: |
          python -I research/okr_readings/knot_direction.py --check
          python -I research/okr_readings/matching_khipus.py --check
      - name: Feature rebuild unit test against the pinned database
        env:
          SZL_OKR_DB: ${{ runner.temp }}/okr/khipu.db
        run: python -m unittest discover -s tests -p test_okr_features.py -v
      - name: Replay the syllabary stress test with the proposal's digest-checked dictionaries
        shell: bash
        run: |
          set -euo pipefail
          alba="https://raw.githubusercontent.com/Alba-Research/KhipuReader/7c2722b91fcad514653c96f40fa2dae125de92b8"
          mkdir -p "$RUNNER_TEMP/alba"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/alba/quechua_kaikki_2074.txt" "$alba/reproducibility/data/quechua_kaikki_2074.txt"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/alba/quechua_strict_clean.txt" "$alba/src/khipu_translator/data/quechua_strict_clean.txt"
          printf '%s  %s\n' \
            38e957982087e139ce30a99e24fd41dc97e6b20a7ff8ec6fef158863912cf622 "$RUNNER_TEMP/alba/quechua_kaikki_2074.txt" \
            ad163c3abbb01c46ee3c3107ad85970cda6738d92131ae854b47e7b68a1f67f1 "$RUNNER_TEMP/alba/quechua_strict_clean.txt" \
            | sha256sum -c -
          python -I research/okr_readings/syllabary_stress.py --dict-dir "$RUNNER_TEMP/alba" --check

  gradio-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # requirements/ci/gradio-demo.txt is compiled from the `test` + `gradio`
      # extras and spaces/requirements.txt; tests/test_ci_requirements.py fails
      # if spaces/requirements.txt pins a Gradio this lock does not carry.
      # Pillow is overridden to 13.0.0 (GHSA-8g5g-8vmr-9782). Gradio 6.31.0 still
      # declares pillow<13, so the resolver rejects the hashed set. --no-deps
      # installs that set as written; the next step allows only this one
      # pip-check finding.
      - name: Install hash-locked demo and test dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/gradio-demo.txt --no-deps
          python -m pip install --no-deps -e .
      - name: Check dependency consistency
        run: python scripts/check_gradio_demo_deps.py
      - name: Real Gradio startup and callback smoke
        run: python -m unittest discover -s tests -p gradio_runtime.py -v

  # publish-hf runs only on protected-main pushes; this job proves on every PR
  # that its hash-locked provider dependencies install and import, so a lock
  # bump cannot first fail inside the token-bearing publisher.
  hub-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the publisher's hash-locked dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/hub.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Provider client imports
        run: python -c "import huggingface_hub; from huggingface_hub import HfApi, hf_hub_download; print(huggingface_hub.__version__)"
