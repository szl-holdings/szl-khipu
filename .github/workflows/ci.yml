name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Dependencies come only from the hash-locked set (requirements/ci/test.in
      # mirrors pyproject's runtime deps + `test` extra); the package installs
      # without resolving anything else.
      - name: Install hash-locked dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/test.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  gradio-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # requirements/ci/gradio-demo.txt is compiled from the `test` + `gradio`
      # extras and spaces/requirements.txt; tests/test_ci_requirements.py fails
      # if spaces/requirements.txt pins a Gradio this lock does not carry.
      # Pillow is overridden to 13.0.0 (GHSA-8g5g-8vmr-9782). Gradio 6.31.0 still
      # declares pillow<13, so the resolver rejects the hashed set. --no-deps
      # installs that set as written; the next step allows only this one
      # pip-check finding.
      - name: Install hash-locked demo and test dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/gradio-demo.txt --no-deps
          python -m pip install --no-deps -e .
      - name: Check dependency consistency
        run: python scripts/check_gradio_demo_deps.py
      - name: Real Gradio startup and callback smoke
        run: python -m unittest discover -s tests -p gradio_runtime.py -v

  # publish-hf runs only on protected-main pushes; this job proves on every PR
  # that its hash-locked provider dependencies install and import, so a lock
  # bump cannot first fail inside the token-bearing publisher.
  hub-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the publisher's hash-locked dependencies, then the package
        run: |
          python -m pip install --require-hashes -r requirements/ci/hub.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Provider client imports
        run: python -c "import huggingface_hub; from huggingface_hub import HfApi, hf_hub_download; print(huggingface_hub.__version__)"
