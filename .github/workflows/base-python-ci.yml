# Standard Python gate for the szl-holdings estate: ruff + pytest on the two
# supported interpreters. Installed by the szl-alignment engine (only into
# repos where Python is detected); keep in sync with
# alignment/templates/workflows/base-python-ci.yml.
name: base-python-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Org policy: every action is pinned to a full-length commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: Install the package
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            # Select actual PEP 621 extras; unrelated TOML keys are not extras.
            # Both supported interpreters provide tomllib. Parse failures stop CI.
            package_spec="$(python - <<'PYTHON'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text()).get("project", {})
          optional = project.get("optional-dependencies", {})
          selected = [name for name in ("dev", "test", "tests") if name in optional]
          print(".[" + ",".join(selected) + "]" if selected else ".")
          PYTHON
            )"
            python -m pip install -e "$package_spec"
          fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi

      # Blocking scope is the classes that indicate real breakage (syntax
      # errors, undefined names, unused imports). The full default ruleset runs
      # non-blocking so repos keep visibility without a forced flag day; repos
      # with their own ruff config in pyproject.toml already get stricter
      # behavior from their primary CI.
      - name: "Ruff (blocking: E9/F)"
        run: ruff check . --output-format github --select E9,F

      - name: Ruff (full ruleset, informational)
        run: ruff check . --statistics --exit-zero

      # This package declares the dependencies needed for its unit suite.
      # The separate Gradio job still owns the optional demo qualification.
      - name: Pytest (blocking)
        run: python -m pytest -q tests
