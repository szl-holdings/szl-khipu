# Publish GitHub source to Hugging Face org SZLHOLDINGS.
# GitHub remains canonical. Hub is the mirror.
#
# Requires org/repo secret HF_TOKEN or HF_ORG_TOKEN (write on SZLHOLDINGS).
# If the token is absent, skip with BLOCKED — never fakes a Hub upload.
name: publish-hf
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-hf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Create exact-run deployment provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "szl.hf-deployment-provenance/v1",
              "source_repository": "szl-holdings/szl-khipu",
              "source_commit": os.environ["SOURCE_SHA"],
              "workflow_name": "publish-hf",
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "targets": [
                  "SZLHOLDINGS/szl-khipu",
                  "SZLHOLDINGS/szl-khipu-kernels",
                  "SZLHOLDINGS/TinyKhipu-Nano",
                  "SZLHOLDINGS/ReceiptAgent-Nano",
                  "SZLHOLDINGS/Moons-Nano",
                  "SZLHOLDINGS/MiniEmbed-Nano",
              ],
          }
          Path("hf-deployment-provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload exact-run provenance
        id: provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: szl-khipu-hf-provenance
          path: hf-deployment-provenance.json
          if-no-files-found: error
          retention-days: 90
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[hub]"
      - name: Publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_ORG: SZLHOLDINGS
          SZL_PROVENANCE_SHA256: ${{ steps.provenance.outputs.artifact-digest }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN / HF_ORG_TOKEN unset — Hub publish BLOCKED. GitHub remains the source of truth."
            echo "Not a fake upload. Not a green Hub badge. Clone and 'szl-khipu serve' for the live Python FE+BE."
            echo "::error::HF_TOKEN / HF_ORG_TOKEN is not set — Hub publish cannot run. A mirror that cannot write must not report success."
            exit 1
          fi
          python scripts/publish_hf.py
