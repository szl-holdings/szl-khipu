# Publish GitHub source to Hugging Face org SZLHOLDINGS.
# GitHub remains canonical. Hub is the mirror.
#
# Every run verifies the exact staged source locally without provider access.
# An ordinary push without a provider token reports NOT DEPLOYED and stays green.
# Explicit publication uses a typed default-branch event and fails closed without a token.
name: publish-hf
on:
  repository_dispatch:
    types: [publish-hf]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-hf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate protected default-branch workflow authority
        id: authority
        env:
          AUTH_EVENT_ACTION: ${{ github.event.action || '' }}
          AUTH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTH_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: >-
          python scripts/publish_hf.py --validate-workflow-authority
          --github-output "$GITHUB_OUTPUT"
      - name: Prepare exact staged deployment manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/publish_hf.py --prepare-provenance hf-deployment-provenance.json
      - name: Validate exact staged source offline
        run: python scripts/publish_hf.py --validate-provenance hf-deployment-provenance.json
      - name: Decide provider publication
        if: steps.authority.outputs.authority_valid == 'true'
        id: publication
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: >-
          python scripts/publish_hf.py --publication-policy
          --github-output "$GITHUB_OUTPUT"
      - name: Install provider dependencies
        if: steps.publication.outputs.publish_enabled == 'true'
        run: python -m pip install --upgrade pip && pip install -e ".[hub]"
      - name: Publish to Hugging Face
        if: steps.publication.outputs.publish_enabled == 'true'
        id: publish
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_ORG: SZLHOLDINGS
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN / HF_ORG_TOKEN unset — Hub publish BLOCKED. GitHub remains the source of truth."
            echo "Not a fake upload. Not a green Hub badge. Clone and 'szl-khipu serve' for the live Python FE+BE."
            echo "::error::HF_TOKEN / HF_ORG_TOKEN is not set — Hub publish cannot run. A mirror that cannot write must not report success."
            exit 1
          fi
          python scripts/publish_hf.py \
            --provenance-file hf-deployment-provenance.json \
            --receipt-file hf-deployment-receipt.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish immutable exact-run deployment evidence
        if: steps.publication.outputs.publish_enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The server-visible name binds this exact run attempt, staged-tree
          # manifest, and the immutable commit returned by Hugging Face. The
          # public runtime verifies Actions metadata; it never downloads a ZIP.
          name: ${{ steps.publish.outputs.artifact_name }}
          path: |
            hf-deployment-provenance.json
            hf-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
