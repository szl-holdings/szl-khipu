name: Harden safetensors symlink boundary once

on:
  push:
    branches:
      - build/khipu-x1-wave5-safetensors-inventory
    paths:
      - .github/workflows/_harden_safetensors_symlink_boundary_once.yml

permissions:
  contents: write

concurrency:
  group: harden-safetensors-symlink-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    name: Patch, test, commit, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/khipu-x1-wave5-safetensors-inventory
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Close root and intermediate-component symlink gaps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          common = Path('hardware/khipu-x1/src/khipu_x1/_safetensors_common.py')
          text = common.read_text(encoding='utf-8')
          old = '''    candidate = root.joinpath(*pure.parts)
    if candidate.is_symlink():
        raise SafetensorsInventoryError(
            f"symbolic-link shard is forbidden: {relative}"
        )
    resolved_root = root.resolve(strict=True)
'''
          new = '''    candidate = root
    for part in pure.parts:
        candidate = candidate / part
        if candidate.is_symlink():
            raise SafetensorsInventoryError(
                f"symbolic-link shard component is forbidden: {relative}"
            )
    resolved_root = root.resolve(strict=True)
'''
          if text.count(old) != 1:
              raise SystemExit(f'{common}: expected one shard-symlink block, found {text.count(old)}')
          common.write_text(text.replace(old, new, 1), encoding='utf-8')

          inventory = Path('hardware/khipu-x1/src/khipu_x1/safetensors_inventory.py')
          text = inventory.read_text(encoding='utf-8')
          old = '''    root = Path(model_root).resolve(strict=True)
    if not root.is_dir():
'''
          new = '''    supplied_root = Path(model_root)
    if supplied_root.is_symlink():
        raise SafetensorsInventoryError("symbolic-link model roots are forbidden")
    try:
        root = supplied_root.resolve(strict=True)
    except OSError as exc:
        raise SafetensorsInventoryError("model_root is unavailable") from exc
    if not root.is_dir():
'''
          if text.count(old) != 1:
              raise SystemExit(f'{inventory}: expected one model-root block, found {text.count(old)}')
          inventory.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('hardware/khipu-x1/tests/test_safetensors_inventory.py')
          text = tests.read_text(encoding='utf-8')
          addition = '''


def test_symlinked_model_root_is_rejected(tmp_path: Path) -> None:
    real = tmp_path / "real-model"
    real.mkdir()
    _write_safetensors(
        real / "model.safetensors",
        [("a", "I8", (1,), b"\\x00")],
    )
    alias = tmp_path / "model-alias"
    try:
        alias.symlink_to(real, target_is_directory=True)
    except (OSError, NotImplementedError) as exc:
        pytest.skip(f"symlinks unavailable on this platform: {exc}")

    with pytest.raises(SafetensorsInventoryError, match="model roots"):
        inventory_local_model(alias)


def test_symlinked_shard_directory_component_is_rejected(tmp_path: Path) -> None:
    real = tmp_path / "real-shards"
    real.mkdir()
    _write_safetensors(
        real / "part.safetensors",
        [("a", "I8", (1,), b"\\x00")],
    )
    alias = tmp_path / "shards"
    try:
        alias.symlink_to(real, target_is_directory=True)
    except (OSError, NotImplementedError) as exc:
        pytest.skip(f"symlinks unavailable on this platform: {exc}")
    (tmp_path / "model.safetensors.index.json").write_text(
        json.dumps(
            {
                "metadata": {"total_size": 1},
                "weight_map": {"a": "shards/part.safetensors"},
            }
        ),
        encoding="utf-8",
    )

    with pytest.raises(SafetensorsInventoryError, match="shard component"):
        inventory_local_model(tmp_path)
'''
          if 'test_symlinked_model_root_is_rejected' in text:
              raise SystemExit('symlink regression tests already exist')
          tests.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Execute the complete KHIPU-X1 contract
        working-directory: hardware/khipu-x1
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m py_compile \
            src/khipu_x1/_safetensors_common.py \
            src/khipu_x1/safetensors_inventory.py \
            tests/test_safetensors_inventory.py
          pytest -q
          git diff --check

      - name: Commit only the permanent hardening and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            hardware/khipu-x1/src/khipu_x1/_safetensors_common.py \
            hardware/khipu-x1/src/khipu_x1/safetensors_inventory.py \
            hardware/khipu-x1/tests/test_safetensors_inventory.py
          git rm -- .github/workflows/_harden_safetensors_symlink_boundary_once.yml
          git commit -s -m 'fix(khipu-x1): reject symlinked inventory roots and shard paths'
          git push origin HEAD:build/khipu-x1-wave5-safetensors-inventory
