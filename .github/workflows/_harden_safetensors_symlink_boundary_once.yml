name: Harden safetensors symlink boundary once

on:
  push:
    branches:
      - build/khipu-x1-wave5-safetensors-inventory
    paths:
      - .github/workflows/_harden_safetensors_symlink_boundary_once.yml

permissions:
  contents: write

concurrency:
  group: harden-safetensors-symlink-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    name: Patch, test, commit, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: build/khipu-x1-wave5-safetensors-inventory
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply the bounded source patch
        run: python .github/scripts/_patch_safetensors_symlink_boundary_once.py

      - name: Execute the complete KHIPU-X1 contract
        working-directory: hardware/khipu-x1
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m py_compile \
            src/khipu_x1/_safetensors_common.py \
            src/khipu_x1/safetensors_inventory.py \
            tests/test_safetensors_inventory.py
          pytest -q
          git diff --check

      - name: Commit only the permanent hardening and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            hardware/khipu-x1/src/khipu_x1/_safetensors_common.py \
            hardware/khipu-x1/src/khipu_x1/safetensors_inventory.py \
            hardware/khipu-x1/tests/test_safetensors_inventory.py
          git rm -- \
            .github/scripts/_patch_safetensors_symlink_boundary_once.py \
            .github/workflows/_harden_safetensors_symlink_boundary_once.yml
          git commit -s -m 'fix(khipu-x1): reject symlinked inventory roots and shard paths'
          git push origin HEAD:build/khipu-x1-wave5-safetensors-inventory
